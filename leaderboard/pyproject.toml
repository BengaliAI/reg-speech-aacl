[project]
name = "ben10-leaderboard"
version = "0.1.0"
description = "Maintainer-run Ben-10 regional ASR leaderboard decode + score tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "transformers==5.14.1",
  "accelerate==1.14.0",
  "jiwer==4.0.0",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "pandas==2.3.2",
  "tqdm==4.67.1",
  "numpy==2.0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
