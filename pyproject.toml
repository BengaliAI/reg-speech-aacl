[project]
name = "reg-speech-aacl"
version = "0.1.0"
description = "Ben-10 regional ASR: finetuning, evaluation, and leaderboard tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers==5.14.1",
  "accelerate==1.14.0",
  "datasets>=3.0",
  "evaluate>=0.4",
  "jiwer==4.0.0",
  "huggingface-hub>=0.26",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "pandas==2.3.2",
  "tqdm==4.67.1",
  "numpy==2.0.1",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
